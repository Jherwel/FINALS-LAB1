<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Information Card</title>

  <style>

    * {
    box-sizing: border-box; 
    }

    body {
    margin: 0;
    font-family: "Segoe UI", Verdana, Arial, sans-serif;
    background-color: #eaeeee; 
    color: #263136;
    }

    .page {
    max-width: 960px;
    margin: 0 auto;   
    padding: 24px 16px 60px;
    }

    .header {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #10476e;
    color: #ffffff;
    width: 100%;
    height: 70px;
    margin-bottom: 20px;
    }

    header h1{
        font-size: 1.5rem;
    }



    .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: flex-start;
    }

    .card {
    background-color: #ffffff;
    border-radius: 10px;
    padding: 22px 24px;
    box-shadow: 0 2px 10px rgba(20, 82, 74, 0.08);
    flex: 1 1 380px;
    }

    .card h2 {
    margin-top: 0;
    font-size: 1.2rem;
    color: #143e52;
    border-bottom: 2px solid #d7ede8;
    padding-bottom: 8px;
    }

    form label {
    display: block;
    margin: 14px 0 6px;
    font-weight: 600;
    font-size: 0.9rem;
    }

    form input[type="text"],
    form input[type="email"],
    form input[type="number"],
    form input[type="tel"],
    form input[type="date"],
    form select,
    form textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #cfe0dc;
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
    }

    form input:focus,
    form select:focus,
    form textarea:focus {
    outline: 2px solid #2f6d9c;
    border-color: #2f749c;
    }

    fieldset {
    margin: 14px 0 6px;
    border: 1px solid #cfe0dc;
    border-radius: 6px;
    padding: 10px 12px;
    }

    fieldset legend {
    font-weight: 600;
    padding: 0 6px;
    font-size: 0.9rem;
    }

    label.inline {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-weight: normal;
    margin: 4px 10px 4px 0;
    }

    #showInfoBtn {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background-color: #2f709c;
    color: #ffffff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s ease;
    }

    #showInfoBtn:hover {
    background-color: #255c7e;
    }

    .output p {
    margin: 8px 0;
    padding-bottom: 8px;
    border-bottom: 1px dashed #e0ece9;
    font-size: 0.95rem;
    }

    .output p:last-child {
    border-bottom: none;
    }

    #placeholderMsg {
    color: #7a8b88;
    font-style: italic;
    }

    .hidden {
    display: none;
    }
  </style>
</head>
<body>

    <header class="header">
      <h1>User Information Card...</h1>
    </header>

  <div class="page">

    <div class="layout">

<!-- ======================= INFORMATION ======================= -->
      <form id="infoForm" class="card form-card">
        <h2>Information</h2>
        

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Jherwel Baira" />

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="jherwel@example.com" />

        <label for="age">Age</label>
        <input type="number" id="age" min="0" placeholder="19" />

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="0912 345 6789" />

        <label for="birthday">Birthday</label>
        <input type="date" id="birthday" />

        <label for="country">Country</label>
        <select id="country">
          <option value="">-- Select your country --</option>
          <option value="Philippines">Philippines</option>
          <option value="United States">United States</option>
          <option value="Japan">Japan</option>
          <option value="Other">Other</option>
        </select>

        <label for="address">Address</label>
        <input type="text" id="address" placeholder="Calamba, Laguna" />

        <fieldset>
          <legend>Gender</legend>
          <label class="inline">
            <input type="radio" name="gender" value="Female" /> Female
          </label>
          <label class="inline">
            <input type="radio" name="gender" value="Male" /> Male
          </label>
          <label class="inline">
            <input type="radio" name="gender" value="Prefer not to say" /> Prefer not to say
          </label>
        </fieldset>

        <fieldset>
          <legend>Favorite Color</legend>
          <label class="inline">
            <input type="radio" name="favColor" value="Red" /> Red
          </label>
          <label class="inline">
            <input type="radio" name="favColor" value="Blue" /> Blue
          </label>
          <label class="inline">
            <input type="radio" name="favColor" value="Green" /> Green
          </label>
          <label class="inline">
            <input type="radio" name="favColor" value="Purple" /> Purple
          </label>
        </fieldset>

        <fieldset>
          <legend>Hobbies</legend>
          <label class="inline">
            <input type="checkbox" class="hobby" value="Reading" /> Reading
          </label>
          <label class="inline">
            <input type="checkbox" class="hobby" value="Gaming" /> Gaming
          </label>
          <label class="inline">
            <input type="checkbox" class="hobby" value="Sports" /> Sports
          </label>
          <label class="inline">
            <input type="checkbox" class="hobby" value="Music" /> Music
          </label>
        </fieldset>

        <label for="bio">Short Bio</label>
        <textarea id="bio" rows="3" placeholder="Tell us about yourself..."></textarea>

        <button type="button" id="showInfoBtn">Show My Info</button>
      </form>

      <!-- ======================= THE OUTPUT CARD ======================= -->
      <section class="card output-card">
        <h2>Information Card</h2>

        <div id="output" class="output hidden">
          <p><strong>Full Name:</strong> <span id="outName"></span></p>
          <p><strong>Email:</strong> <span id="outEmail"></span></p>
          <p><strong>Age:</strong> <span id="outAge"></span></p>
          <p><strong>Phone:</strong> <span id="outPhone"></span></p>
          <p><strong>Birthday:</strong> <span id="outBirthday"></span></p>
          <p><strong>Address:</strong> <span id="outAddress"></span></p>
          <p><strong>Country:</strong> <span id="outCountry"></span></p>
          <p><strong>Gender:</strong> <span id="outGender"></span></p>
          <p><strong>Favorite Color:</strong> <span id="outFavColor"></span></p>
          <p><strong>Hobbies:</strong> <span id="outHobbies"></span></p>
          <p><strong>Bio:</strong> <span id="outBio"></span></p>
        </div>

        <p id="placeholderMsg">Your info will appear here after you click "Show My Info".</p>
      </section>

    </div>
  </div>


  <script>

const showInfoBtn = document.getElementById("showInfoBtn");

showInfoBtn.addEventListener("click", function () {

  showMyInfo();
});


function showMyInfo() {

  /* getElementById */

  const fullName = document.getElementById("fullName").value;
  const email = document.getElementById("email").value;
  const age = document.getElementById("age").value;
  const phone = document.getElementById("phone").value;
  const birthday = document.getElementById("birthday").value;
  const address = document.getElementById("address").value;
  const bio = document.getElementById("bio").value;
  const country = document.getElementById("country").value;


  /*querySelector */
  const genderChecked = document.querySelector('input[name="gender"]:checked');
  const gender = genderChecked ? genderChecked.value : "(not selected)";


  /* querySelectorAll */
  const favColorRadios = document.querySelectorAll('input[name="favColor"]');
  let favColor = "(not selected)";
  for (let i = 0; i < favColorRadios.length; i++) {
    if (favColorRadios[i].checked) {
      favColor = favColorRadios[i].value;
    }
  }


  /* getElementsByClassName */
  const hobbyCheckboxes = document.getElementsByClassName("hobby");
  let hobbies = [];
  for (let i = 0; i < hobbyCheckboxes.length; i++) {
    if (hobbyCheckboxes[i].checked) {
      hobbies.push(hobbyCheckboxes[i].value);
    }
  }
  const hobbiesText = hobbies.length > 0 ? hobbies.join(", ") : "(none selected)";


  /* Output */
  document.getElementById("outName").textContent = fullName || "None";
  document.getElementById("outEmail").textContent = email || "None";
  document.getElementById("outAge").textContent = age || "None";
  document.getElementById("outPhone").textContent = phone || "None";
  document.getElementById("outBirthday").textContent = birthday || "None";
  document.getElementById("outAddress").textContent = address || "None";
  document.getElementById("outCountry").textContent = country || "None";
  document.getElementById("outGender").textContent = gender;
  document.getElementById("outFavColor").textContent = favColor;
  document.getElementById("outHobbies").textContent = hobbiesText;
  document.getElementById("outBio").textContent = bio || "None";


  /* Reveal Output Card */
  document.getElementById("output").classList.remove("hidden");
  document.getElementById("placeholderMsg").classList.add("hidden");
}
  </script>

  
</body>
</html>
